name: Build and publish benchmark images

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo docker image prune --all --force
          df -h
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish ASR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: asr.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/vast-bench-asr:v2
      - name: Build and publish diarization
        uses: docker/build-push-action@v6
        with:
          context: .
          file: diar.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/vast-bench-diar:v2
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}
