name: Publish Parakeet v3 ASR candidate

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  publish-asr-v3:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          driver: docker-container
      - name: Refuse an occupied serverless tag before login
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/vast-bench-asr-serverless
          TAG: parakeet-${{ github.sha }}
        run: '! docker buildx imagetools inspect "$IMAGE:$TAG"'
      - name: Login to GHCR
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build one immutable serverless wrapper
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/vast-bench-asr-serverless
          TAG: parakeet-${{ github.sha }}
        run: |
          set -euo pipefail
          ! docker buildx imagetools inspect "$IMAGE:$TAG"
          docker buildx build --platform linux/amd64 --push --provenance=mode=max --sbom=true --metadata-file metadata.json -f asr/vast-serverless.Dockerfile -t "$IMAGE:$TAG" .
          digest="$(jq -r '."containerimage.digest"' metadata.json)"
          test "$digest" != null
          docker buildx imagetools inspect "$IMAGE@$digest"
