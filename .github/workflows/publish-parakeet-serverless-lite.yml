name: Publish Parakeet serverless lite image

on:
  workflow_dispatch:
  push:
    branches:
      - publish/parakeet-serverless-lite-20260828

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: SocketDev/action@2d3f25590c6ed6ba11a9a14c064d962a3a04698f # v1.3.1
        with:
          mode: firewall-free
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Materialize hash-locked build context
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p vendor/wheelhouses/parakeet-v3 vendor/models .ci
          curl --fail --location --retry 3 \
            --output .ci/antlr4-python3-runtime-4.9.3.tar.gz \
            https://files.pythonhosted.org/packages/3e/38/7859ff46355f76f8d19459005ca000b6e7012f2f1ca597746cbcd1fbfe5e/antlr4-python3-runtime-4.9.3.tar.gz
          echo "f224469b4168294902bb1efa80a8bf7855f24c99aef99cbefc1bcd3cce77881b  .ci/antlr4-python3-runtime-4.9.3.tar.gz" | sha256sum --check --strict
          docker run --rm --network none \
            -e SOURCE_DATE_EPOCH=0 \
            -v "$PWD:/workspace" -w /workspace \
            pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime@sha256:c8268a92a69bd500f8be0e665b2630ee006dadaf7bfbc24249141b15ff622755 \
            python3 -m pip wheel --no-deps --no-index --no-build-isolation \
            --wheel-dir vendor/wheelhouses/parakeet-v3 \
            /workspace/.ci/antlr4-python3-runtime-4.9.3.tar.gz
          echo "ffb51877578142e5df83abad6f59eed91050c79e4b4fc511dc12f3effddaddc6  vendor/wheelhouses/parakeet-v3/antlr4_python3_runtime-4.9.3-py3-none-any.whl" | sha256sum --check --strict
          grep -v '^antlr4-python3-runtime==' locks/parakeet-v3.requirements.txt > /tmp/parakeet-v3.requirements.txt
          grep -v '^antlr4-python3-runtime==' locks/parakeet-v3.bootstrap.requirements.txt > /tmp/parakeet-v3.bootstrap.requirements.txt
          python -m pip download --no-deps --require-hashes \
            --find-links vendor/wheelhouses/parakeet-v3 \
            --dest vendor/wheelhouses/parakeet-v3 \
            -r /tmp/parakeet-v3.requirements.txt
          python -m pip download --no-deps --require-hashes \
            --find-links vendor/wheelhouses/parakeet-v3 \
            --dest vendor/wheelhouses/parakeet-v3 \
            -r /tmp/parakeet-v3.bootstrap.requirements.txt
          curl --fail --location --retry 3 \
            --header "Authorization: Bearer $HF_TOKEN" \
            --output vendor/models/parakeet-tdt-0.6b-v3.nemo \
            https://huggingface.co/nvidia/parakeet-tdt-0.6b-v3/resolve/541d1f99c6b0c3cd0b11a95167540bb8edefd82b/parakeet-tdt-0.6b-v3.nemo
          echo "3cbdc85877e668ca7b82d0d56770eb1fac76691f55d6b97545e8d61ca588d10d  vendor/models/parakeet-tdt-0.6b-v3.nemo" | sha256sum --check --strict
      - name: Login to GHCR
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, publish, and verify immutable image
        env:
          OWNER: ${{ github.repository_owner }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/$OWNER/vast-bench-parakeet-serverless-lite"
          docker buildx build --platform linux/amd64 --push \
            --provenance=mode=max --sbom=true \
            --metadata-file image-metadata.json \
            -f asr/vast-serverless-lite.Dockerfile \
            -t "$image:candidate-$SOURCE_SHA" .
          digest="$(jq -r '."containerimage.digest"' image-metadata.json)"
          test "$digest" != null
          manifest="$(docker buildx imagetools inspect --raw "$image@$digest")"
          compressed_bytes="$(printf '%s' "$manifest" | jq '[.layers[]?.size // 0] | add // 0')"
          test "$compressed_bytes" -le 5368709120
          {
            printf 'Image: `%s@%s`\n\n' "$image" "$digest"
            printf 'Compressed manifest layers: `%s` bytes\n' "$compressed_bytes"
          } >> "$GITHUB_STEP_SUMMARY"
