name: Publish known-vulnerable non-production Parakeet v3 canary

on:
  workflow_dispatch:
    inputs:
      authorize_known_vulnerable_canary:
        description: Explicitly authorize the documented canary-only OSV bypass
        required: true
        type: boolean
      proof_only:
        description: Build and import-test the overlay without publishing
        required: true
        type: boolean
      target:
        description: Select the canary image to build
        required: true
        type: choice
        default: asr
        options:
          - asr
          - diar
          - bootstrap-wheel

concurrency:
  group: publish-asr-v3-${{ github.sha }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  publish-asr-v3:
    if: inputs.authorize_known_vulnerable_canary && inputs.target == 'asr' && github.ref == 'refs/heads/canary/parakeet-v3-known-vulnerable-20260904'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out immutable overlay
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: overlay
      - name: Check out immutable application source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: 482204e85c2c9ab440e9351e5495d037c25a37cf
          path: source
      - name: Apply the build-only overlay
        run: |
          set -euo pipefail
          cp overlay/asr/vast-serverless.Dockerfile source/asr/vast-serverless.Dockerfile
          cp overlay/asr/server.py source/asr/server.py
          cp overlay/asr/offline_entrypoint.py source/asr/offline_entrypoint.py
          cp overlay/asr/vast-pyworker.py source/asr/vast-pyworker.py
          cp overlay/asr/vast-entrypoint.sh source/asr/vast-entrypoint.sh
          cp overlay/locks/parakeet-v3.requirements.txt source/locks/parakeet-v3.requirements.txt
          cp overlay/locks/parakeet-v3.artifacts.json source/locks/parakeet-v3.artifacts.json
          test "$(git -C source rev-parse HEAD)" = 482204e85c2c9ab440e9351e5495d037c25a37cf
          test "$(git -C overlay rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          driver: docker-container
          version: v0.36.1
      - uses: SocketDev/action@2d3f25590c6ed6ba11a9a14c064d962a3a04698f # v1.3.1
        with:
          mode: firewall-free
      - name: Scan exact source (authorized canary warning)
        continue-on-error: true
        working-directory: source
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/workspace:ro" -w /workspace ghcr.io/google/osv-scanner-action@sha256:2b2b9fbe57b14097fb6953577f2fbecf49941e2346c4eceb9f0852a9682ae868 scan --recursive .
      - name: Prepare fail-closed GHCR tag guard
        if: '!inputs.proof_only'
        run: |
          guard="$RUNNER_TEMP/refuse-occupied-ghcr-tag"
          cat > "$guard" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          : "${GITHUB_ACTOR:?GITHUB_ACTOR is required}"
          : "${GITHUB_TOKEN:?GITHUB_TOKEN is required}"
          : "${IMAGE:?IMAGE is required}"
          : "${TAG:?TAG is required}"

          repository="${IMAGE#ghcr.io/}"
          if [ "$repository" = "$IMAGE" ] || [ -z "$repository" ]; then
            echo "IMAGE must be a non-empty ghcr.io repository." >&2
            exit 1
          fi

          token_body="$(mktemp)"
          manifest_body="$(mktemp)"
          trap 'rm -f "$token_body" "$manifest_body"' EXIT

          if ! token_status="$(
            printf 'user = "%s:%s"\n' "$GITHUB_ACTOR" "$GITHUB_TOKEN" |
              curl --config - --silent --show-error --proto '=https' --connect-timeout 15 --max-time 60 --output "$token_body" --write-out '%{http_code}' --get --data-urlencode 'service=ghcr.io' --data-urlencode "scope=repository:$repository:pull" https://ghcr.io/token
          )"; then
            echo "GHCR token request failed before an HTTP response was confirmed." >&2
            exit 1
          fi
          if [ "$token_status" != 200 ]; then
            echo "GHCR token request failed with HTTP $token_status." >&2
            exit 1
          fi
          if ! registry_token="$(jq -ser '
            def b64token: type == "string" and test("^[A-Za-z0-9._~+/-]+={0,}\\z");
            if length != 1 or (.[0] | type) != "object" then empty
            else .[0] |
              if (.token? | b64token)
                   and (((.access_token? | type) == "null") or (.access_token == .token))
              then .token
              elif ((.token? | type) == "null") and (.access_token? | b64token)
              then .access_token
              else empty end
            end
          ' "$token_body")"; then
            echo "GHCR token response was malformed or ambiguous." >&2
            exit 1
          fi

          if ! manifest_status="$(curl --silent --show-error --proto '=https' --connect-timeout 15 --max-time 60 --output "$manifest_body" --write-out '%{http_code}' --header "Authorization: Bearer $registry_token" --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' "https://ghcr.io/v2/$repository/manifests/$TAG")"; then
            echo "GHCR manifest request failed before an HTTP response was confirmed." >&2
            exit 1
          fi

          if [ "$manifest_status" = 404 ] && jq -e '
            type == "object" and
            ((.errors | type) == "array") and
            ((.errors | length) > 0) and
            all(.errors[];
              type == "object" and
              (.code == "MANIFEST_UNKNOWN") and
              ((.message | type) == "string") and
              ((.message | length) > 0))
          ' "$manifest_body" >/dev/null; then
            echo "Confirmed unoccupied tag: $IMAGE:$TAG"
            exit 0
          fi

          if [ "$manifest_status" = 200 ]; then
            echo "Refusing occupied tag: $IMAGE:$TAG" >&2
          else
            echo "GHCR manifest check failed closed with HTTP $manifest_status." >&2
          fi
          exit 1
          EOF
      - name: Refuse an occupied serverless tag before login
        if: '!inputs.proof_only'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/vast-bench-asr-serverless
          TAG: canary-known-vulnerable-parakeet-482204e85c2c9ab440e9351e5495d037c25a37cf-${{ github.run_id }}
        run: bash "$RUNNER_TEMP/refuse-occupied-ghcr-tag"
      - name: Login to GHCR
        if: '!inputs.proof_only'
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch and verify exact baked model
        working-directory: source
        env:
          MODEL_URL: https://huggingface.co/nvidia/parakeet-tdt-0.6b-v3/resolve/541d1f99c6b0c3cd0b11a95167540bb8edefd82b/parakeet-tdt-0.6b-v3.nemo
          MODEL_SHA256: 3cbdc85877e668ca7b82d0d56770eb1fac76691f55d6b97545e8d61ca588d10d
          MODEL_SIZE_BYTES: 2509332480
        run: |
          set -euo pipefail
          model=vendor/models/parakeet-tdt-0.6b-v3.nemo
          mkdir -p "${model%/*}"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors --output "$model" "$MODEL_URL"
          test "$(wc -c < "$model" | tr -d ' ')" = "$MODEL_SIZE_BYTES"
          printf '%s  %s\n' "$MODEL_SHA256" "$model" | sha256sum -c -
      - name: Materialize hash-verified wheelhouse
        working-directory: source
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, re, shutil, urllib.request
          from pathlib import Path

          wheelhouse = Path("vendor/wheelhouses/parakeet-v3")
          artifacts = json.loads(Path("locks/parakeet-v3.artifacts.json").read_text())["wheels"]
          locked = {
              re.sub(r"[_.]+", "-", match.group(1).lower()): (
                  match.group(2), set(re.findall(r"--hash=sha256:([0-9a-f]{64})", block))
              )
              for block in re.split(r"(?m)^(?=[A-Za-z0-9_.-]+==)", Path("locks/parakeet-v3.requirements.txt").read_text())
              if (match := re.match(r"^([A-Za-z0-9_.-]+)==([^\\s]+)", block))
          }
          artifacts = [
              artifact for artifact in artifacts
              if (locked_entry := locked.get(re.sub(r"[_.]+", "-", artifact["name"].lower())))
              and artifact["version"] == locked_entry[0]
              and artifact["sha256"] in locked_entry[1]
          ]
          if not {re.sub(r"[_.]+", "-", artifact["name"].lower()) for artifact in artifacts} <= locked.keys():
              raise SystemExit("artifact manifest is not a subset of the lock")
          for artifact in artifacts:
              target = wheelhouse / artifact["filename"]
              if target.is_file() and hashlib.sha256(target.read_bytes()).hexdigest() == artifact["sha256"]:
                  continue
              if artifact["source"] == "local audited bootstrap":
                  raise SystemExit(f"missing audited bootstrap wheel: {target.name}")
              temporary = target.with_suffix(target.suffix + ".partial")
              temporary.unlink(missing_ok=True)
              try:
                  with urllib.request.urlopen(artifact["source"], timeout=120) as response, temporary.open("wb") as output:
                      shutil.copyfileobj(response, output)
                  if hashlib.sha256(temporary.read_bytes()).hexdigest() != artifact["sha256"]:
                      raise SystemExit(f"wheel hash mismatch: {target.name}")
                  temporary.replace(target)
              finally:
                  temporary.unlink(missing_ok=True)
          PY
          python -m pip download --dest vendor/wheelhouses/parakeet-v3 --find-links vendor/wheelhouses/parakeet-v3 --only-binary=:all: --no-deps --require-hashes --platform manylinux1_x86_64 --platform manylinux2010_x86_64 --platform manylinux2014_x86_64 --platform manylinux_2_5_x86_64 --platform manylinux_2_12_x86_64 --platform manylinux_2_17_x86_64 --platform manylinux_2_24_x86_64 --platform manylinux_2_27_x86_64 --platform manylinux_2_28_x86_64 --platform manylinux_2_31_x86_64 --platform linux_x86_64 --implementation cp --python-version 3.11 --index-url https://pypi.org/simple --extra-index-url https://download.pytorch.org/whl/cu124 -r locks/parakeet-v3.requirements.txt
      - name: Build real-model benchmark image
        working-directory: source
        env:
          CPU_BENCHMARK_IMAGE: local/parakeet-v3-real-model-benchmark:${{ github.run_id }}-${{ github.run_attempt }}
          SOURCE_SHA: 482204e85c2c9ab440e9351e5495d037c25a37cf
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --load --provenance=false --sbom=false --label "org.opencontainers.image.revision=$SOURCE_SHA" --label "io.adaudit.build-overlay=$GITHUB_SHA" -f asr/vast-serverless.Dockerfile -t "$CPU_BENCHMARK_IMAGE" .
      - name: Real-model benchmark on CPU
        working-directory: source
        env:
          CPU_BENCHMARK_IMAGE: local/parakeet-v3-real-model-benchmark:${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          worker_dir="$(mktemp -d)"
          container="$(docker run --detach --rm --name parakeet-real-model-benchmark --publish 8080:8080 --env PARAKEET_INSTANCES=3 --entrypoint python3 "$CPU_BENCHMARK_IMAGE" /workspace/server.py)"
          cleanup() {
            docker logs "$container" || true
            docker rm --force "$container" >/dev/null 2>&1 || true
            rm -rf "$worker_dir"
          }
          trap cleanup EXIT
          deadline=$((SECONDS + 900))
          while :; do
            health="$(python3 -c 'import json
          from urllib.request import urlopen
          try:
              with urlopen("http://127.0.0.1:8080/healthz", timeout=5) as response:
                  print(json.load(response).get("status", ""))
          except Exception:
              pass' || true)"
            [ "$health" = ready ] && break
            [ "$SECONDS" -lt "$deadline" ] || { echo "real-model server did not become ready" >&2; exit 1; }
            sleep 5
          done
          docker cp "$container:/workspace/vast-pyworker/." "$worker_dir"
          PYWORKER_DIR="$worker_dir" VAST_BENCHMARK_ARTIFACT=asr/fixtures/audio/2086-149220-0033.wav python3 - <<'PY'
          import asyncio
          import os
          import json
          import runpy
          import sys
          import types
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          fake = types.ModuleType("vastai")
          fake.BenchmarkConfig = fake.HandlerConfig = fake.LogActionConfig = fake.WorkerConfig = lambda **kwargs: kwargs
          fake.Worker = lambda _: type("Worker", (), {"run": lambda self: None})()
          sys.modules["vastai"] = fake
          worker = runpy.run_path(os.path.join(os.environ["PYWORKER_DIR"], "worker.py"), run_name="cpu_benchmark")
          payload = worker["benchmark_payload"]()
          request = Request("http://127.0.0.1:8080/transcribe-batch", data=json.dumps(payload).encode(), headers={"Content-Type": "application/json"}, method="POST")
          try:
              with urlopen(request, timeout=900) as response:
                  status, body, headers = response.status, response.read(), dict(response.headers.items())
          except HTTPError as error:
              status, body, headers = error.code, error.read(), dict(error.headers.items())
          print(f"benchmark status={status}")
          print(f"benchmark body_head={body[:2000].decode('utf-8', 'replace')}")
          if status != 200:
              raise SystemExit(f"real-model benchmark returned HTTP {status}")
          class Response:
              def __init__(self, **kwargs):
                  self.kwargs = kwargs
          class ClientRequest:
              async def json(self):
                  return {"auth_data": {}, "session_id": None, "payload": payload}
          class ModelResponse:
              def __init__(self):
                  self.status = status
                  self.content_type = headers.get("Content-Type", "application/json").split(";", 1)[0]
                  self.headers = headers
              async def read(self):
                  return body
          fake_aiohttp = types.ModuleType("aiohttp")
          fake_aiohttp.web = types.SimpleNamespace(Response=Response)
          previous_aiohttp = sys.modules.get("aiohttp")
          sys.modules["aiohttp"] = fake_aiohttp
          try:
              validated = asyncio.run(worker["validated_response"](ClientRequest(), ModelResponse()))
          finally:
              if previous_aiohttp is None:
                  sys.modules.pop("aiohttp", None)
              else:
                  sys.modules["aiohttp"] = previous_aiohttp
          validated_status = validated.kwargs["status"]
          print(f"validated_response status={validated_status}")
          if validated_status != 200:
              raise SystemExit(f"validated_response returned HTTP {validated_status}")
          PY
      - name: Prove offline imports
        if: inputs.proof_only
        working-directory: source
        env:
          CPU_BENCHMARK_IMAGE: local/parakeet-v3-real-model-benchmark:${{ github.run_id }}-${{ github.run_attempt }}
        run: docker run --rm --entrypoint python "$CPU_BENCHMARK_IMAGE" -I -c "import nemo, torch, vastai, cuda.bindings; from nemo.collections.asr.models import ASRModel"
      - name: Build one immutable serverless wrapper
        if: '!inputs.proof_only'
        id: build
        working-directory: source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/vast-bench-asr-serverless
          SOURCE_SHA: 482204e85c2c9ab440e9351e5495d037c25a37cf
          STAGING_TAG: staging-canary-known-vulnerable-parakeet-482204e85c2c9ab440e9351e5495d037c25a37cf-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --push --provenance=mode=max --sbom=true --metadata-file metadata.json --label "org.opencontainers.image.revision=$SOURCE_SHA" --label "io.adaudit.canary=known-vulnerable-non-production" -f asr/vast-serverless.Dockerfile -t "$IMAGE:$STAGING_TAG" .
          digest="$(jq -r '."containerimage.digest"' metadata.json)"
          test "$digest" != null
          docker pull "$IMAGE@$digest"
          docker save "$IMAGE@$digest" -o image.tar
          docker run --rm -v "$PWD:/workspace:ro" -w /workspace ghcr.io/google/osv-scanner-action@sha256:2b2b9fbe57b14097fb6953577f2fbecf49941e2346c4eceb9f0852a9682ae868 scan image --archive /workspace/image.tar || echo 'WARNING: authorized known-vulnerable non-production canary OSV result retained in this run log.' >&2
          docker buildx imagetools inspect "$IMAGE@$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest final OCI index
        if: '!inputs.proof_only'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/vast-bench-asr-serverless
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Promote attested digest to final tag
        if: '!inputs.proof_only'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/vast-bench-asr-serverless
          TAG: canary-known-vulnerable-parakeet-482204e85c2c9ab440e9351e5495d037c25a37cf-${{ github.run_id }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          promotion_manifest="$(docker buildx imagetools create --dry-run --prefer-index=false "$IMAGE@$DIGEST")"
          planned_digest="sha256:$(printf '%s' "$promotion_manifest" | sha256sum | awk '{print $1}')"
          test "$planned_digest" = "$DIGEST"

          bash "$RUNNER_TEMP/refuse-occupied-ghcr-tag"

          if docker buildx imagetools create --prefer-index=false --tag "$IMAGE:$TAG" "$IMAGE@$DIGEST"; then
            exit 0
          fi

          resolved="$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' 2>/dev/null | jq -er '.digest')" || exit 1
          test "$resolved" = "$DIGEST"
  publish-diar-v1:
    if: inputs.authorize_known_vulnerable_canary && inputs.target == 'diar' && github.ref == 'refs/heads/canary/parakeet-v3-known-vulnerable-20260904'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out immutable overlay
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: overlay
      - name: Check out immutable application source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: 482204e85c2c9ab440e9351e5495d037c25a37cf
          path: source
      - name: Apply the build-only overlay
        run: |
          set -euo pipefail
          rm -f source/diar/rp_handler.py source/diar/worker.py source/diar/requirements.txt source/diar/constraints.txt
          cp overlay/diar.Dockerfile source/diar.Dockerfile
          cp overlay/diar/server.py overlay/diar/vast-pyworker.py overlay/diar/vast-entrypoint.sh overlay/diar/bake_models.py source/diar/
          cp overlay/locks/diar-v1.requirements.txt source/locks/diar-v1.requirements.txt
          cp overlay/locks/diar-v1.artifacts.json source/locks/diar-v1.artifacts.json
          cp overlay/vendor/wheelhouses/parakeet-v3/ctc_segmentation-1.7.4-cp311-cp311-linux_x86_64.whl source/vendor/wheelhouses/parakeet-v3/
          printf '%s  %s\n' e105ffc70ef98a15f7d8f30477135235681b8a6d8a2b156aae53efd2de3631f3 source/vendor/wheelhouses/parakeet-v3/ctc_segmentation-1.7.4-cp311-cp311-linux_x86_64.whl | sha256sum -c -
          test "$(git -C source rev-parse HEAD)" = 482204e85c2c9ab440e9351e5495d037c25a37cf
          test "$(git -C overlay rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          driver: docker-container
          version: v0.36.1
      - uses: SocketDev/action@2d3f25590c6ed6ba11a9a14c064d962a3a04698f # v1.3.1
        with:
          mode: firewall-free
      - name: Scan exact source (warning retained in canary log)
        continue-on-error: true
        working-directory: source
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/workspace:ro" -w /workspace ghcr.io/google/osv-scanner-action@sha256:2b2b9fbe57b14097fb6953577f2fbecf49941e2346c4eceb9f0852a9682ae868 scan --recursive .
      - name: Prepare fail-closed GHCR tag guard
        if: '!inputs.proof_only'
        run: |
          guard="$RUNNER_TEMP/refuse-occupied-ghcr-tag"
          cat > "$guard" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          : "${GITHUB_ACTOR:?GITHUB_ACTOR is required}"
          : "${GITHUB_TOKEN:?GITHUB_TOKEN is required}"
          : "${IMAGE:?IMAGE is required}"
          : "${TAG:?TAG is required}"

          repository="${IMAGE#ghcr.io/}"
          if [ "$repository" = "$IMAGE" ] || [ -z "$repository" ]; then
            echo "IMAGE must be a non-empty ghcr.io repository." >&2
            exit 1
          fi

          token_body="$(mktemp)"
          manifest_body="$(mktemp)"
          trap 'rm -f "$token_body" "$manifest_body"' EXIT

          if ! token_status="$(
            printf 'user = "%s:%s"\n' "$GITHUB_ACTOR" "$GITHUB_TOKEN" |
              curl --config - --silent --show-error --proto '=https' --connect-timeout 15 --max-time 60 --output "$token_body" --write-out '%{http_code}' --get --data-urlencode 'service=ghcr.io' --data-urlencode "scope=repository:$repository:pull" https://ghcr.io/token
          )"; then
            echo "GHCR token request failed before an HTTP response was confirmed." >&2
            exit 1
          fi
          if [ "$token_status" != 200 ]; then
            echo "GHCR token request failed with HTTP $token_status." >&2
            exit 1
          fi
          if ! registry_token="$(jq -ser '
            def b64token: type == "string" and test("^[A-Za-z0-9._~+/-]+={0,}\\z");
            if length != 1 or (.[0] | type) != "object" then empty
            else .[0] |
              if (.token? | b64token)
                   and (((.access_token? | type) == "null") or (.access_token == .token))
              then .token
              elif ((.token? | type) == "null") and (.access_token? | b64token)
              then .access_token
              else empty end
            end
          ' "$token_body")"; then
            echo "GHCR token response was malformed or ambiguous." >&2
            exit 1
          fi

          if ! manifest_status="$(curl --silent --show-error --proto '=https' --connect-timeout 15 --max-time 60 --output "$manifest_body" --write-out '%{http_code}' --header "Authorization: Bearer $registry_token" --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' "https://ghcr.io/v2/$repository/manifests/$TAG")"; then
            echo "GHCR manifest request failed before an HTTP response was confirmed." >&2
            exit 1
          fi

          if [ "$manifest_status" = 404 ] && jq -e '
            type == "object" and
            ((.errors | type) == "array") and
            ((.errors | length) > 0) and
            all(.errors[];
              type == "object" and
              (.code == "MANIFEST_UNKNOWN") and
              ((.message | type) == "string") and
              ((.message | length) > 0))
          ' "$manifest_body" >/dev/null; then
            echo "Confirmed unoccupied tag: $IMAGE:$TAG"
            exit 0
          fi

          if [ "$manifest_status" = 200 ]; then
            echo "Refusing occupied tag: $IMAGE:$TAG" >&2
          else
            echo "GHCR manifest check failed closed with HTTP $manifest_status." >&2
          fi
          exit 1
          EOF
      - name: Refuse an occupied serverless tag before login
        if: '!inputs.proof_only'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/vast-bench-diar-serverless
          TAG: canary-sortformer-diar-v1-482204e85c2c9ab440e9351e5495d037c25a37cf-${{ github.run_id }}
        run: bash "$RUNNER_TEMP/refuse-occupied-ghcr-tag"
      - name: Login to GHCR
        if: '!inputs.proof_only'
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch and verify exact baked model
        working-directory: source
        env:
          MODEL_URL: https://huggingface.co/nvidia/diar_streaming_sortformer_4spk-v2.1/resolve/fafaab5faa1617a0ca52d38dd3dc4bd636800d3d/diar_streaming_sortformer_4spk-v2.1.nemo
          MODEL_SHA256: 8abd32832159c6ac1148c926b7276f35ba34582c444e559dce1f1253fea42ef8
          MODEL_SIZE_BYTES: 471367680
        run: |
          set -euo pipefail
          model=vendor/models/diar_streaming_sortformer_4spk-v2.1.nemo
          mkdir -p "${model%/*}"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors --output "$model" "$MODEL_URL"
          test "$(wc -c < "$model" | tr -d ' ')" = "$MODEL_SIZE_BYTES"
          printf '%s  %s\n' "$MODEL_SHA256" "$model" | sha256sum -c -
      - name: Materialize hash-verified wheelhouse
        working-directory: source
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, re, shutil, urllib.request
          from pathlib import Path

          wheelhouse = Path("vendor/wheelhouses/diar-v1")
          bootstrap_wheelhouse = Path("vendor/wheelhouses/parakeet-v3")
          wheelhouse.mkdir(parents=True, exist_ok=True)
          artifacts = json.loads(Path("locks/diar-v1.artifacts.json").read_text())["wheels"]
          locked = {
              re.sub(r"[_.]+", "-", match.group(1).lower()): (
                  match.group(2), set(re.findall(r"--hash=sha256:([0-9a-f]{64})", block))
              )
              for block in re.split(r"(?m)^(?=[A-Za-z0-9_.-]+==)", Path("locks/diar-v1.requirements.txt").read_text())
              if (match := re.match(r"^([A-Za-z0-9_.-]+)==([^\s]+)", block))
          }
          artifacts = [
              artifact for artifact in artifacts
              if (locked_entry := locked.get(re.sub(r"[_.]+", "-", artifact["name"].lower())))
              and artifact["version"] == locked_entry[0]
              and artifact["sha256"] in locked_entry[1]
          ]
          if not {re.sub(r"[_.]+", "-", artifact["name"].lower()) for artifact in artifacts} <= locked.keys():
              raise SystemExit("artifact manifest is not a subset of the lock")
          for artifact in artifacts:
              if artifact["source"] != "local audited bootstrap":
                  continue
              source = bootstrap_wheelhouse / artifact["filename"]
              target = wheelhouse / artifact["filename"]
              if not source.is_file() or hashlib.sha256(source.read_bytes()).hexdigest() != artifact["sha256"]:
                  raise SystemExit(f"audited bootstrap wheel is unavailable or corrupt: {source.name}")
              if not target.is_file() or hashlib.sha256(target.read_bytes()).hexdigest() != artifact["sha256"]:
                  shutil.copy2(source, target)
          for artifact in artifacts:
              target = wheelhouse / artifact["filename"]
              if target.is_file() and hashlib.sha256(target.read_bytes()).hexdigest() == artifact["sha256"]:
                  continue
              if artifact["source"] == "local audited bootstrap":
                  raise SystemExit(f"missing audited bootstrap wheel: {target.name}")
              temporary = target.with_suffix(target.suffix + ".partial")
              temporary.unlink(missing_ok=True)
              try:
                  with urllib.request.urlopen(artifact["source"], timeout=120) as response, temporary.open("wb") as output:
                      shutil.copyfileobj(response, output)
                  if hashlib.sha256(temporary.read_bytes()).hexdigest() != artifact["sha256"]:
                      raise SystemExit(f"wheel hash mismatch: {target.name}")
                  temporary.replace(target)
              finally:
                  temporary.unlink(missing_ok=True)
          PY
          python -m pip download --dest vendor/wheelhouses/diar-v1 --find-links vendor/wheelhouses/diar-v1 --only-binary=:all: --no-deps --require-hashes --platform manylinux1_x86_64 --platform manylinux2010_x86_64 --platform manylinux2014_x86_64 --platform manylinux_2_5_x86_64 --platform manylinux_2_12_x86_64 --platform manylinux_2_17_x86_64 --platform manylinux_2_24_x86_64 --platform manylinux_2_27_x86_64 --platform manylinux_2_28_x86_64 --platform manylinux_2_31_x86_64 --platform linux_x86_64 --implementation cp --python-version 3.11 --index-url https://pypi.org/simple --extra-index-url https://download.pytorch.org/whl/cu124 -r locks/diar-v1.requirements.txt
      - name: Build real-model benchmark image
        working-directory: source
        env:
          CPU_BENCHMARK_IMAGE: local/diar-v1-real-model-benchmark:${{ github.run_id }}-${{ github.run_attempt }}
          SOURCE_SHA: 482204e85c2c9ab440e9351e5495d037c25a37cf
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --load --provenance=false --sbom=false --label "org.opencontainers.image.revision=$SOURCE_SHA" --label "io.adaudit.build-overlay=$GITHUB_SHA" -f diar.Dockerfile -t "$CPU_BENCHMARK_IMAGE" .
      - name: Real-model benchmark on CPU
        working-directory: source
        env:
          CPU_BENCHMARK_IMAGE: local/diar-v1-real-model-benchmark:${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          worker_dir="$(mktemp -d)"
          container="$(docker run --detach --rm --name diar-real-model-benchmark --publish 8080:8080 --entrypoint python3 "$CPU_BENCHMARK_IMAGE" /workspace/server.py)"
          cleanup() {
            docker logs "$container" || true
            docker rm --force "$container" >/dev/null 2>&1 || true
            rm -rf "$worker_dir"
          }
          trap cleanup EXIT
          deadline=$((SECONDS + 900))
          while :; do
            health="$(python3 -c 'import json
          from urllib.request import urlopen
          try:
              with urlopen("http://127.0.0.1:8080/healthz", timeout=5) as response:
                  print(json.load(response).get("status", ""))
          except Exception:
              pass' || true)"
            [ "$health" = ready ] && break
            [ "$SECONDS" -lt "$deadline" ] || { echo "real-model server did not become ready" >&2; exit 1; }
            sleep 5
          done
          docker cp "$container:/workspace/vast-pyworker/." "$worker_dir"
          PYWORKER_DIR="$worker_dir" python3 - <<'PY'
          import base64
          import json
          import os
          import runpy
          import sys
          import types
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          fake = types.ModuleType("vastai")
          fake.BenchmarkConfig = fake.HandlerConfig = fake.LogActionConfig = fake.WorkerConfig = lambda **kwargs: kwargs
          fake.Worker = lambda _: type("Worker", (), {"run": lambda self: None})()
          sys.modules["vastai"] = fake
          worker = runpy.run_path(os.path.join(os.environ["PYWORKER_DIR"], "worker.py"), run_name="cpu_benchmark")
          payload = worker["benchmark_payload"]()
          request = Request("http://127.0.0.1:8080/diarize", data=json.dumps(payload).encode(), headers={"Content-Type": "application/json"}, method="POST")
          try:
              with urlopen(request, timeout=900) as response:
                  status, body = response.status, response.read()
          except HTTPError as error:
              status, body = error.code, error.read()
          print(f"benchmark status={status}")
          print(f"benchmark body_head={body[:2000].decode('utf-8', 'replace')}")
          if status != 200:
              raise SystemExit(f"real-model benchmark returned HTTP {status}")
          response = json.loads(body)
          worker["validate_response"](response)
          if "speaker_turns" not in response:
              raise SystemExit("real-model benchmark response omitted speaker_turns")
          PY
      - name: Real-entrypoint readiness on CPU
        working-directory: source
        env:
          CPU_BENCHMARK_IMAGE: local/diar-v1-real-model-benchmark:${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          container="$(docker run --detach --rm --name diar-real-entrypoint-readiness --env WORKER_PORT=3000 --env USE_SSL=false --env REPORT_ADDR=http://127.0.0.1:9 --env CONTAINER_ID=0 --env MASTER_TOKEN=x --env PYWORKER_VERSION=0 --env URL=http://127.0.0.1:3000 "$CPU_BENCHMARK_IMAGE")"
          cleanup() {
            docker logs "$container" || true
            docker rm --force "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          deadline=$((SECONDS + 900))
          while :; do
            logs="$(docker logs "$container" 2>&1 || true)"
            if printf '%s\n' "$logs" | grep -Fq 'Got log line indicating model is loaded' || printf '%s\n' "$logs" | grep -Fq 'Running benchmark'; then
              break
            fi
            [ "$SECONDS" -lt "$deadline" ] || { echo "entrypoint did not start PyWorker or benchmark" >&2; exit 1; }
            sleep 5
          done
      - name: Prove offline imports
        if: inputs.proof_only
        working-directory: source
        env:
          CPU_BENCHMARK_IMAGE: local/diar-v1-real-model-benchmark:${{ github.run_id }}-${{ github.run_attempt }}
        run: docker run --rm --entrypoint python "$CPU_BENCHMARK_IMAGE" -I -c "import nemo, torch, vastai, cuda.bindings; from nemo.collections.asr.models import SortformerEncLabelModel"
      - name: Build one immutable serverless wrapper
        if: '!inputs.proof_only'
        id: build
        working-directory: source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/vast-bench-diar-serverless
          SOURCE_SHA: 482204e85c2c9ab440e9351e5495d037c25a37cf
          STAGING_TAG: staging-canary-sortformer-diar-v1-482204e85c2c9ab440e9351e5495d037c25a37cf-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --push --provenance=mode=max --sbom=true --metadata-file metadata.json --label "org.opencontainers.image.revision=$SOURCE_SHA" --label "io.adaudit.canary=sortformer-diar-v1-non-production" -f diar.Dockerfile -t "$IMAGE:$STAGING_TAG" .
          digest="$(jq -r '."containerimage.digest"' metadata.json)"
          test "$digest" != null
          docker pull "$IMAGE@$digest"
          docker save "$IMAGE@$digest" -o image.tar
          docker run --rm -v "$PWD:/workspace:ro" -w /workspace ghcr.io/google/osv-scanner-action@sha256:2b2b9fbe57b14097fb6953577f2fbecf49941e2346c4eceb9f0852a9682ae868 scan image --archive /workspace/image.tar || echo 'WARNING: canary OSV result retained in this run log.' >&2
          docker buildx imagetools inspect "$IMAGE@$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest final OCI index
        if: '!inputs.proof_only'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/vast-bench-diar-serverless
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Promote attested digest to final tag
        if: '!inputs.proof_only'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/vast-bench-diar-serverless
          TAG: canary-sortformer-diar-v1-482204e85c2c9ab440e9351e5495d037c25a37cf-${{ github.run_id }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          promotion_manifest="$(docker buildx imagetools create --dry-run --prefer-index=false "$IMAGE@$DIGEST")"
          planned_digest="sha256:$(printf '%s' "$promotion_manifest" | sha256sum | awk '{print $1}')"
          test "$planned_digest" = "$DIGEST"
          bash "$RUNNER_TEMP/refuse-occupied-ghcr-tag"
          if docker buildx imagetools create --prefer-index=false --tag "$IMAGE:$TAG" "$IMAGE@$DIGEST"; then
            exit 0
          fi
          resolved="$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' 2>/dev/null | jq -er '.digest')" || exit 1
          test "$resolved" = "$DIGEST"
  bootstrap-wheel:
    if: inputs.target == 'bootstrap-wheel' && github.ref == 'refs/heads/canary/parakeet-v3-known-vulnerable-20260904'
    runs-on: ubuntu-24.04
    env:
      PACKAGE: ctc_segmentation
      VERSION: 1.7.4
      SDIST_SHA256: 19d383ea5f22438ebb1699d72b22078b63f351a33fa50bedb19c14077ba6a116
      BUILD_REQUIRES: cython==3.3.0 numpy==1.26.4 setuptools==80.9.0 wheel==0.45.1
    steps:
      - name: Build audited wheel from hash-pinned sdist inside the pinned lean base
        run: |
          set -euo pipefail
          mkdir -p out
          docker run --rm --platform linux/amd64 -v "$PWD/out:/out" \
            -e PACKAGE -e VERSION -e SDIST_SHA256 -e BUILD_REQUIRES \
            python:3.11-slim-bookworm@sha256:2fc9207f64226cb05ac317cee0bab6fa55a9ea311ce5a086baddd4b4a83c2d3c sh -euc '
              apt-get update -qq >/dev/null && apt-get install -y -qq --no-install-recommends build-essential >/dev/null
              pip install -q --no-cache-dir $BUILD_REQUIRES
              pip download -q --no-deps --no-binary :all: "$PACKAGE==$VERSION" -d /tmp/sd
              sdist=$(ls /tmp/sd/*.tar.gz)
              printf "%s  %s\n" "$SDIST_SHA256" "$sdist" | sha256sum -c -
              pip wheel -q --no-deps --no-build-isolation "$sdist" -w /out
              cp "$sdist" /out/
              cd /out && sha256sum *.whl *.tar.gz | tee SHA256SUMS
            '
      - uses: actions/upload-artifact@v4
        with:
          name: bootstrap-wheel-ctc_segmentation-1.7.4
          path: out/
          retention-days: 3
