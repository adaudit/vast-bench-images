name: Publish known-vulnerable non-production Parakeet v3 canary

on:
  workflow_dispatch:
    inputs:
      authorize_known_vulnerable_canary:
        description: Explicitly authorize the documented canary-only OSV bypass
        required: true
        type: boolean
      proof_only:
        description: Build and import-test the overlay without publishing
        required: true
        type: boolean

concurrency:
  group: publish-asr-v3-${{ github.sha }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  publish-asr-v3:
    if: inputs.authorize_known_vulnerable_canary && github.ref == 'refs/heads/canary/parakeet-v3-known-vulnerable-20260904'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out immutable overlay
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: overlay
      - name: Check out immutable application source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: 482204e85c2c9ab440e9351e5495d037c25a37cf
          path: source
      - name: Apply the build-only overlay
        run: |
          set -euo pipefail
          cp overlay/asr/vast-serverless.Dockerfile source/asr/vast-serverless.Dockerfile
          cp overlay/locks/parakeet-v3.requirements.txt source/locks/parakeet-v3.requirements.txt
          cp overlay/locks/parakeet-v3.artifacts.json source/locks/parakeet-v3.artifacts.json
          test "$(git -C source rev-parse HEAD)" = 482204e85c2c9ab440e9351e5495d037c25a37cf
          test "$(git -C overlay rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          driver: docker-container
          version: v0.36.1
      - uses: SocketDev/action@2d3f25590c6ed6ba11a9a14c064d962a3a04698f # v1.3.1
        with:
          mode: firewall-free
      - name: Scan exact source (authorized canary warning)
        continue-on-error: true
        working-directory: source
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/workspace:ro" -w /workspace ghcr.io/google/osv-scanner-action@sha256:2b2b9fbe57b14097fb6953577f2fbecf49941e2346c4eceb9f0852a9682ae868 scan --recursive .
      - name: Prepare fail-closed GHCR tag guard
        if: '!inputs.proof_only'
        run: |
          guard="$RUNNER_TEMP/refuse-occupied-ghcr-tag"
          cat > "$guard" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          : "${GITHUB_ACTOR:?GITHUB_ACTOR is required}"
          : "${GITHUB_TOKEN:?GITHUB_TOKEN is required}"
          : "${IMAGE:?IMAGE is required}"
          : "${TAG:?TAG is required}"

          repository="${IMAGE#ghcr.io/}"
          if [ "$repository" = "$IMAGE" ] || [ -z "$repository" ]; then
            echo "IMAGE must be a non-empty ghcr.io repository." >&2
            exit 1
          fi

          token_body="$(mktemp)"
          manifest_body="$(mktemp)"
          trap 'rm -f "$token_body" "$manifest_body"' EXIT

          if ! token_status="$(
            printf 'user = "%s:%s"\n' "$GITHUB_ACTOR" "$GITHUB_TOKEN" |
              curl --config - --silent --show-error --proto '=https' --connect-timeout 15 --max-time 60 --output "$token_body" --write-out '%{http_code}' --get --data-urlencode 'service=ghcr.io' --data-urlencode "scope=repository:$repository:pull" https://ghcr.io/token
          )"; then
            echo "GHCR token request failed before an HTTP response was confirmed." >&2
            exit 1
          fi
          if [ "$token_status" != 200 ]; then
            echo "GHCR token request failed with HTTP $token_status." >&2
            exit 1
          fi
          if ! registry_token="$(jq -ser '
            def b64token: type == "string" and test("^[A-Za-z0-9._~+/-]+={0,}\\z");
            if length != 1 or (.[0] | type) != "object" then empty
            else .[0] |
              if (.token? | b64token)
                   and (((.access_token? | type) == "null") or (.access_token == .token))
              then .token
              elif ((.token? | type) == "null") and (.access_token? | b64token)
              then .access_token
              else empty end
            end
          ' "$token_body")"; then
            echo "GHCR token response was malformed or ambiguous." >&2
            exit 1
          fi

          if ! manifest_status="$(curl --silent --show-error --proto '=https' --connect-timeout 15 --max-time 60 --output "$manifest_body" --write-out '%{http_code}' --header "Authorization: Bearer $registry_token" --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' "https://ghcr.io/v2/$repository/manifests/$TAG")"; then
            echo "GHCR manifest request failed before an HTTP response was confirmed." >&2
            exit 1
          fi

          if [ "$manifest_status" = 404 ] && jq -e '
            type == "object" and
            ((.errors | type) == "array") and
            ((.errors | length) > 0) and
            all(.errors[];
              type == "object" and
              (.code == "MANIFEST_UNKNOWN") and
              ((.message | type) == "string") and
              ((.message | length) > 0))
          ' "$manifest_body" >/dev/null; then
            echo "Confirmed unoccupied tag: $IMAGE:$TAG"
            exit 0
          fi

          if [ "$manifest_status" = 200 ]; then
            echo "Refusing occupied tag: $IMAGE:$TAG" >&2
          else
            echo "GHCR manifest check failed closed with HTTP $manifest_status." >&2
          fi
          exit 1
          EOF
      - name: Refuse an occupied serverless tag before login
        if: '!inputs.proof_only'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/vast-bench-asr-serverless
          TAG: canary-known-vulnerable-parakeet-482204e85c2c9ab440e9351e5495d037c25a37cf-${{ github.run_id }}
        run: bash "$RUNNER_TEMP/refuse-occupied-ghcr-tag"
      - name: Login to GHCR
        if: '!inputs.proof_only'
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch and verify exact baked model
        working-directory: source
        env:
          MODEL_URL: https://huggingface.co/nvidia/parakeet-tdt-0.6b-v3/resolve/541d1f99c6b0c3cd0b11a95167540bb8edefd82b/parakeet-tdt-0.6b-v3.nemo
          MODEL_SHA256: 3cbdc85877e668ca7b82d0d56770eb1fac76691f55d6b97545e8d61ca588d10d
          MODEL_SIZE_BYTES: 2509332480
        run: |
          set -euo pipefail
          model=vendor/models/parakeet-tdt-0.6b-v3.nemo
          mkdir -p "${model%/*}"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors --output "$model" "$MODEL_URL"
          test "$(wc -c < "$model" | tr -d ' ')" = "$MODEL_SIZE_BYTES"
          printf '%s  %s\n' "$MODEL_SHA256" "$model" | sha256sum -c -
      - name: Materialize hash-verified wheelhouse
        working-directory: source
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, re, shutil, urllib.request
          from pathlib import Path

          wheelhouse = Path("vendor/wheelhouses/parakeet-v3")
          artifacts = json.loads(Path("locks/parakeet-v3.artifacts.json").read_text())["wheels"]
          locked = {
              re.sub(r"[_.]+", "-", match.group(1).lower()): (
                  match.group(2), set(re.findall(r"--hash=sha256:([0-9a-f]{64})", block))
              )
              for block in re.split(r"(?m)^(?=[A-Za-z0-9_.-]+==)", Path("locks/parakeet-v3.requirements.txt").read_text())
              if (match := re.match(r"^([A-Za-z0-9_.-]+)==([^\\s]+)", block))
          }
          artifacts = [
              artifact for artifact in artifacts
              if (locked_entry := locked.get(re.sub(r"[_.]+", "-", artifact["name"].lower())))
              and artifact["version"] == locked_entry[0]
              and artifact["sha256"] in locked_entry[1]
          ]
          if not {re.sub(r"[_.]+", "-", artifact["name"].lower()) for artifact in artifacts} <= locked:
              raise SystemExit("artifact manifest is not a subset of the lock")
          for artifact in artifacts:
              target = wheelhouse / artifact["filename"]
              if target.is_file() and hashlib.sha256(target.read_bytes()).hexdigest() == artifact["sha256"]:
                  continue
              if artifact["source"] == "local audited bootstrap":
                  raise SystemExit(f"missing audited bootstrap wheel: {target.name}")
              temporary = target.with_suffix(target.suffix + ".partial")
              temporary.unlink(missing_ok=True)
              try:
                  with urllib.request.urlopen(artifact["source"], timeout=120) as response, temporary.open("wb") as output:
                      shutil.copyfileobj(response, output)
                  if hashlib.sha256(temporary.read_bytes()).hexdigest() != artifact["sha256"]:
                      raise SystemExit(f"wheel hash mismatch: {target.name}")
                  temporary.replace(target)
              finally:
                  temporary.unlink(missing_ok=True)
          PY
          python -m pip download --dest vendor/wheelhouses/parakeet-v3 --find-links vendor/wheelhouses/parakeet-v3 --only-binary=:all: --no-deps --require-hashes --platform manylinux1_x86_64 --platform manylinux2010_x86_64 --platform manylinux2014_x86_64 --platform manylinux_2_5_x86_64 --platform manylinux_2_12_x86_64 --platform manylinux_2_17_x86_64 --platform manylinux_2_24_x86_64 --platform manylinux_2_27_x86_64 --platform manylinux_2_28_x86_64 --platform manylinux_2_31_x86_64 --platform linux_x86_64 --implementation cp --python-version 3.11 --index-url https://pypi.org/simple --extra-index-url https://download.pytorch.org/whl/cu124 -r locks/parakeet-v3.requirements.txt
      - name: Build and prove the offline overlay
        if: inputs.proof_only
        working-directory: source
        env:
          SOURCE_SHA: 482204e85c2c9ab440e9351e5495d037c25a37cf
          PROOF_IMAGE: local/parakeet-v3-overlay-proof:${{ github.run_id }}
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --load --provenance=false --sbom=false --label "org.opencontainers.image.revision=$SOURCE_SHA" --label "io.adaudit.build-overlay=$GITHUB_SHA" -f asr/vast-serverless.Dockerfile -t "$PROOF_IMAGE" .
          docker run --rm --entrypoint python "$PROOF_IMAGE" -I -c "import nemo, torch, vastai"
      - name: Build one immutable serverless wrapper
        if: '!inputs.proof_only'
        id: build
        working-directory: source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/vast-bench-asr-serverless
          SOURCE_SHA: 482204e85c2c9ab440e9351e5495d037c25a37cf
          STAGING_TAG: staging-canary-known-vulnerable-parakeet-482204e85c2c9ab440e9351e5495d037c25a37cf-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --push --provenance=mode=max --sbom=true --metadata-file metadata.json --label "org.opencontainers.image.revision=$SOURCE_SHA" --label "io.adaudit.canary=known-vulnerable-non-production" -f asr/vast-serverless.Dockerfile -t "$IMAGE:$STAGING_TAG" .
          digest="$(jq -r '."containerimage.digest"' metadata.json)"
          test "$digest" != null
          docker pull "$IMAGE@$digest"
          docker save "$IMAGE@$digest" -o image.tar
          docker run --rm -v "$PWD:/workspace:ro" -w /workspace ghcr.io/google/osv-scanner-action@sha256:2b2b9fbe57b14097fb6953577f2fbecf49941e2346c4eceb9f0852a9682ae868 scan image --archive /workspace/image.tar || echo 'WARNING: authorized known-vulnerable non-production canary OSV result retained in this run log.' >&2
          docker buildx imagetools inspect "$IMAGE@$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest final OCI index
        if: '!inputs.proof_only'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/vast-bench-asr-serverless
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Promote attested digest to final tag
        if: '!inputs.proof_only'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/vast-bench-asr-serverless
          TAG: canary-known-vulnerable-parakeet-482204e85c2c9ab440e9351e5495d037c25a37cf-${{ github.run_id }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          promotion_manifest="$(docker buildx imagetools create --dry-run --prefer-index=false "$IMAGE@$DIGEST")"
          planned_digest="sha256:$(printf '%s' "$promotion_manifest" | sha256sum | awk '{print $1}')"
          test "$planned_digest" = "$DIGEST"

          bash "$RUNNER_TEMP/refuse-occupied-ghcr-tag"

          if docker buildx imagetools create --prefer-index=false --tag "$IMAGE:$TAG" "$IMAGE@$DIGEST"; then
            exit 0
          fi

          resolved="$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' 2>/dev/null | jq -er '.digest')" || exit 1
          test "$resolved" = "$DIGEST"
